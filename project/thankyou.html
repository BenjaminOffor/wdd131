<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Thank you for joining the Ghana Chamber of Commerce."/>
    <title>Thank You</title>
    <link rel="stylesheet" href="styles/chamber.css" />
</head>
<body>

    </script>

</html>
