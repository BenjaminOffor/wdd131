<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Thank You - Ghana Chamber of Commerce</title>
    <link rel="stylesheet" href="styles/chamber.css" /> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      main {
        padding: 2rem;
        text-align: center;
      }
      .thank-you-message {
        background-color: #f0fdf4;
        border: 1px solid #d1fae5;
        color: #065f46;
        padding: 2rem;
        border-radius: 8px;
        margin-bottom: 2rem;
      }
      .back-to-home {
        display: inline-block;
        background-color: #003366;
        color: white;
        padding: 0.75rem 1.5rem;
        text-decoration: none;
        border-radius: 4px;
        font-size: 1rem;
        transition: background-color 0.3s ease;
        margin-top: 1rem;
      }
      
      .back-to-home:hover {
        background-color: #002244;
      }
    </style>
</head>
<body>
    <header>
        <h1>Ghana Chamber of Commerce</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Directory</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="#">Resources</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="thank-you-message">
            <h2>Thank You for Joining!</h2>
            <p>Your application has been received. We will contact you shortly.</p>
        </div>
        <a href="index.html" class="back-to-home">Back to Home</a>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Ghana Chamber of Commerce</p>
    </footer>
    <script>
       document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
