<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Membership Form for Ghana Chamber of Commerce."/>
    <title>Join the Chamber</title>
    <link rel="stylesheet" href="styles/chamber.css" />
</head>
<body>
    <header>
        <h1>Join the Ghana Chamber of Commerce</h1>
    </header>

    <main>
        <form action="thankyou.html" method="get">
            <label for="name">Full Name:</label>
            <input type="text" name="name" id="name" required />

            <label for="email">Email Address:</label>
            <input type="email" name="email" id="email" required />

            <label for="company">Company Name:</label>
            <input type="text" name="company" id="company" required />

            <label for="industry">Industry:</label>
            <select name="industry" id="industry" required>
                <option value="">Select an Industry</option>
                <option value="finance">Finance</option>
                <option value="technology">Technology</option>
                <option value="agriculture">Agriculture</option>
            </select>

            <input type="submit" value="Submit Membership" />
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Ghana Chamber of Commerce | All Rights Reserved</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
        document.getElementById("lastModified").textContent = document.lastModified;
    </script>
</body>
</html>
