<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Join Us - Ghana Chamber of Commerce</title>
    <link rel="stylesheet" href="styles/chamber.css" /> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      form {
        max-width: 600px;
        margin: 2rem auto;
        padding: 2rem;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
      }
      
      form label {
        margin-top: 1rem;
        display: block;
      }
      
      form input, form select {
        padding: 0.75rem;
        margin-top: 0.5rem;
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      
      form input[type="submit"] {
        background-color: #003366;
        color: white;
        padding: 1rem;
        border: none;
        border-radius: 4px;
        margin-top: 2rem;
        cursor: pointer;
        font-size: 1rem;
      }
      
      form input[type="submit"]:hover {
        background-color: #002244;
      }
      
      @media (max-width: 768px) {
        form {
          width: 95%;
        }
      }
    </style>
</head>
<body>
    <header>
        <h1>Ghana Chamber of Commerce</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Directory</a></li>
                <li><a href="#">Events</a></li>
                <li><a href="#">Resources</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="join-us">
            <h2>Join Us</h2>
            <p>Become a member of the Ghana Chamber of Commerce and unlock numerous benefits!</p>
            <form id="new-member-form" action="thankyou.html" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required><br><br>

                <label for="business-name">Business Name:</label>
                <input type="text" id="business-name" name="business-name" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required><br><br>

                <label for="membership-level">Membership Level:</label>
                <select id="membership-level" name="membership-level">
                    <option value="member">Member</option>
                    <option value="silver">Silver</option>
                    <option value="gold">Gold</option>
                </select><br><br>

                <input type="submit" value="Join Now">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Ghana Chamber of Commerce</p>
    </footer>
    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
